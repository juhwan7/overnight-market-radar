name: Validate changes without production credentials
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m unittest discover -s tests/radar -v
      - run: python -m radar.verify
      - run: npm ci --ignore-scripts
      - run: npm run build
